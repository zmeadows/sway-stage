# Nested splith/splitv layout with Firefox and three Foot terminals.
# Width ratios 44:32:24, right-column height ratios 77:23, and final browser focus.
# Adapt Firefox's executable and exact app_id to your installation (or use class for Xwayland).
# See ../docs/SPECIFICATION.md for the configuration contract.
version: 1  # ← Required; do not remove
focus: browser
layout:
  group: splith
  children:
    - id: browser
      weight: 44
      command: [firefox-esr, --new-window]
      match:
        app_id: firefox-esr
    - id: middle
      weight: 32
      command: [foot, --app-id=sway-stage-middle]
      match:
        app_id: sway-stage-middle
    - group: splitv
      weight: 24
      children:
        - id: upper-right
          weight: 77
          command: [foot, --app-id=sway-stage-top]
          match:
            app_id: sway-stage-top
        - id: lower-right
          weight: 23
          command: [foot, --app-id=sway-stage-bottom]
          match:
            app_id: sway-stage-bottom
