# Version 1 layout; validate with --layouts-dir examples check four-windows.
# Applies width ratios 44:32:24, right-column height ratios 77:23, and browser focus.
# See docs/SPECIFICATION.md. Adapt executable names and IDs to your installation.
# Mirrors sway_four_windows.py: Firefox, middle Foot, then two right-hand Foot windows.
# Unlike the script's PID suffixes, these explicit IDs are stable. Only new windows match.
version: 1
# Shared project directory; replace with your project path. Relative to this YAML file.
cwd: ..
focus: browser # Optional; the first leaf is also the default.
layout:
  group: splith
  children:
    - id: browser
      weight: 44
      command: [firefox-esr, --new-window]
      match:
        app_id: firefox-esr
    - id: middle
      weight: 32
      command: [foot, --app-id=sway-stage-middle]
      match:
        app_id: sway-stage-middle
    - group: splitv
      weight: 24
      children:
        - id: upper-right
          weight: 77
          command: [foot, --app-id=sway-stage-top]
          match:
            app_id: sway-stage-top
        - id: lower-right
          weight: 23
          command: [foot, --app-id=sway-stage-bottom]
          match:
            app_id: sway-stage-bottom
