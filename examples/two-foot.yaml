# Minimal splith layout; requires Foot. Distinct --app-id values match each new terminal.
# Equal widths; final focus defaults to the left window. See ../docs/SPECIFICATION.md.
version: 1  # ← Required; do not remove
layout:
  group: splith
  children:
    - id: left
      command: [foot, --app-id=sway-stage-left]
      match:
        app_id: sway-stage-left
    - id: right
      command: [foot, --app-id=sway-stage-right]
      match:
        app_id: sway-stage-right
