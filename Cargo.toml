[package]
name = "sway-stage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A lightweight declarative workspace launcher for Sway"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zmeadows/sway-stage"
keywords = ["sway", "wayland", "workspace", "layout", "launcher"]
categories = ["command-line-utilities"]
# Revisit when the project has a usable release.
publish = false

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
serde_path_to_error = "0.1"
swayipc = "4.0.0"

[dev-dependencies]
serde_json = "1.0"
signal-hook = { version = "0.4.6", default-features = false }

# Development-only Sway diagnostics; `examples/` holds user-facing YAML layouts.
[[example]]
name = "inspect_sway"
path = "tools/inspect_sway.rs"
test = false
bench = false

[[example]]
name = "observe_sway"
path = "tools/observe_sway.rs"
test = false
bench = false

# Development-only integration harness, replacing scripts/integration.py; user-run only.
[[example]]
name = "integration"
path = "tools/integration/main.rs"
test = false
bench = false

# Offline tests of the harness modules. A separate crate root without main.rs, so no test
# can reach the harness entry point.
[[test]]
name = "integration_harness"
path = "tools/integration/offline_tests.rs"
